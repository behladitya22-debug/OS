<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MJ OS</title>
  <style>
    html,body{
      margin:0;
      height:100%;
      overflow: hidden;
    }
    #wallpaper{
      width:100%;
      height:100%;
      background: linear-gradient(180deg, #1a1820 0%, #050406 100%);
      position:relative;
    }
    .sparkle{
      position:absolute;
      width:3px;
      height:3px;
      border-radius:50%;
      background:#e9d38a;
      box-shadow: 0 0 6px 1px rgba(233, 211, 138,0.8);
      animation: twinkle 2.5s ease-in-out infinite;
    }
    @keyframes twinkle{
      0%,100%{opacity:0.2;transform: scale(1);}
      50%{opacity:1; transform:scale(1.8);}
    }
    #topbar{
      position:absolute;
      top:0;
      left:0;
      right:0;
      height:34px;
      display:flex;
      align-items:center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(255,255,255,0.07);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      color: #ece9e3;
      font-family : sans-serif;
      font-size: 13px;
      box-sizing: border-box;
    }
    #icons{
      position:absolute;
      top:50px;
      left: 16px;
    }
    .icon{
      width:70px;
      background: none;
      border:none;
      color:#ece9e3;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
      cursor:pointer;
      font-family:sans-serif;
    }
    .icon-glyph{
      font-size: 24px;
      width: 44px;
      height:44px;
      display:flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      object-fit: contain;
      padding: 6px;
    }
    .icon-label{
      font-size:11px;
    }
    .window{
      position:absolute;
      top:120px;
      left:120px;
      width:220px;
      background:rgba(255,255,255,0.08);
      border-radius: 10px;
      color:#ece9e3;
      font-family:sans-serif;
      display:none;
    }
    .window-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:8px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      cursor:move;
    }
    .window-body{
      padding:16px;
      font-size:13px;
    }
    .calc-display{
      background:#050507;
      margin:0 16px;
      padding:10px;
      border-radius:6px;
      text-align:right;
      font-size:20px;
      font-family:monospace;
    }
    .calc-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:6px;
      padding:16px;
    }
    .calc-btn{
      background:rgba(255,255,255,0.1);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:6px;
      color:#ece9e3;
      font-size:14px;
      padding:10px 0;
      cursor:pointer;
    }
        .record{
      width:120px;
      height:120px;
      margin:16px auto;
      border-radius:50%;
      background: repeating-radial-gradient(circle, #0c0b0e 0px, #0c0b0e 2px, #222 3px, #222 4px);
      display:flex;
      align-items:center;
      justify-content:center;
      animation: spin 3s linear infinite;
      animation-play-state: paused;
      object-fit:contain;
    }
    .record.spinning{
      animation-play-state: running;
    }
    @keyframes spin{
      to{ transform: rotate(360deg); }
    }
    .vinyl-controls{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      padding:16px;
    }
    .vinyl-btn{
      background:#d4af37;
      color:#1a1508;
      border:none;
      border-radius:20px;
      padding:8px 20px;
      font-family:sans-serif;
      font-size:13px;
      cursor:pointer;
    }
    .browser-bar{
      display:flex;
      gap:6px;
      padding:8px;
    }
    #browser-url{
      flex:1;
      background:#050507;
      border:1px solid rgba(255,255,255,0.2);
      border-radius:14px;
      color:#ece9e3;
      padding:6px 10px;
      font-size:12px;
    }
    #go-btn{
      background:#d4af37;
      color:#1a1508;
      border:none;
      border-radius:14px;
      padding:6px 14px;
      font-size:12px;
      cursor:pointer;
    }
    #browser-frame{
      width:100%;
      height:220px;
      border:none;
      background:#fff;
    }
  </style>
</head>
<body>

  <div id="wallpaper">
    <div class="sparkle" style="top: 15%; left: 20%; animation-delay: 0s;"></div>
    <div class="sparkle" style="top: 30%; left: 70%; animation-delay: 0.5s;"></div>
    <div class="sparkle" style="top: 55%; left: 40%; animation-delay: 1s;"></div>
    <div class="sparkle" style="top: 70%; left: 80%; animation-delay: 1.5s;"></div>
    <div class="sparkle" style="top: 80%; left: 15%; animation-delay: 2s;"></div>
  </div>
<div id="topbar">
  <span>MJ OS</span>
  <span id="clock">--:--</span>
</div>
<div id="icons">
<button class="icon" onclick="document.getElementById('calc-window').style.display='block'">
  <img class="icon-glyph" src="calculator.jpg" alt="calculator" />
  <span class="icon-label">calculator</span>
</button>
<button class="icon" onclick="document.getElementById('vinyl-window').style.display='block'">
  <img class="icon-glyph" src="vinyl.jpg" alt="vinyl player"/>
  <span class="icon-label">vinyl</span>
</button>
  <button class="icon" onclick="document.getElementById('browser-window').style.display='block'">
  <span class="icon-glyph">🌐</span>
  <span class="icon-label">browser</span>
</button>
</div>
<div class="window" id="calc-window">
  <div class="window-bar">
    <span>calculator</span>
    <button onclick="document.getElementById('calc-window').style.display='none'">✕</button>
  </div>
    <div class="calc-display" id="calc-display">0</div>
  <div class="calc-grid">
    <button class="calc-btn" onclick="calcInput('7')">7</button>
    <button class="calc-btn" onclick="calcInput('8')">8</button>
    <button class="calc-btn" onclick="calcInput('9')">9</button>
    <button class="calc-btn" onclick="calcInput('/')">÷</button>

    <button class="calc-btn" onclick="calcInput('4')">4</button>
    <button class="calc-btn" onclick="calcInput('5')">5</button>
    <button class="calc-btn" onclick="calcInput('6')">6</button>
    <button class="calc-btn" onclick="calcInput('*')">×</button>

    <button class="calc-btn" onclick="calcInput('1')">1</button>
    <button class="calc-btn" onclick="calcInput('2')">2</button>
    <button class="calc-btn" onclick="calcInput('3')">3</button>
    <button class="calc-btn" onclick="calcInput('-')">−</button>

    <button class="calc-btn" onclick="calcClear()">C</button>
    <button class="calc-btn" onclick="calcInput('0')">0</button>
    <button class="calc-btn" onclick="calcEquals()">=</button>
    <button class="calc-btn" onclick="calcInput('+')">+</button>
  </div>
</div>
<div class="window" id="vinyl-window">
  <div class="window-bar">
    <span>vinyl player</span>
    <button onclick="document.getElementById('vinyl-window').style.display='none'">✕</button>
  </div>
  <div class="vinyl-controls">
    <img class="record" id="record" src="vinyl.jpg" alt="vinyl record" />
    <button class="vinyl-btn" id="play-btn" onclick="togglePlay()">Play</button>
    <input type="file" id="song-file" accept="audio/*" onchange="loadSong()" />
    <audio id="song-audio"></audio>
  </div>
</div>
<div class="window" id="browser-window" style="width:320px;">
  <div class="window-bar">
    <span>browser</span>
    <button onclick="document.getElementById('browser-window').style.display='none'">✕</button>
  </div>
  <div class="browser-bar">
    <input id="browser-url" type="text" placeholder="type a website..." />
    <button id="go-btn" onclick="goToSite()">Go</button>
  </div>
  <iframe id="browser-frame" src="https://example.com"></iframe>
</div>
<script>
  function updateClock(){
    const now = new Date();
    const h = now.getHours().toString().padStart(2,"0")
    const m = now.getMinutes().toString().padStart(2,"0")
    document.getElementById("clock").textContent = h + ":" + m;
  }
  updateClock();
  setInterval(updateClock,1000);
  
  function calcInput(value){
    const display = document.getElementById('calc-display');
    if(display.textContent === '0'){
      display.textContent = value;
    } else {
      display.textContent = display.textContent + value;
    }
  }

  function calcClear(){
    document.getElementById('calc-display').textContent = '0';
  }

  function calcEquals(){
    const display = document.getElementById('calc-display');
    try{
      display.textContent = eval(display.textContent);
    } catch(e){
      display.textContent = 'Error';
    }
  }
  function loadSong(){
    const file = document.getElementById('song-file').files[0];
    if(!file) return;
    const audio = document.getElementById('song-audio');
    audio.src = URL.createObjectURL(file);
  }

  function togglePlay(){
    const audio = document.getElementById('song-audio');
    const record = document.getElementById('record');
    const btn = document.getElementById('play-btn');
    if(audio.paused){
      audio.play();
      record.classList.add('spinning');
      btn.textContent = 'Pause';
    } else {
      audio.pause();
      record.classList.remove('spinning');
      btn.textContent = 'Play';
    }
  }
    function goToSite(){
    let input = document.getElementById('browser-url').value.trim();
    if(!input) return;
    let url;
    if(input.includes('.') && !input.includes(' ')){
      url = input.startsWith('http') ? input : 'https://' + input;
    } else {
      url = 'https://www.google.com/search?q=' + encodeURIComponent(input) + '&igu=1';
    }
    document.getElementById('browser-frame').src = url;
  }
  
  let draggedWindow = null;
  let offsetX = 0;
  let offsetY = 0;

  document.querySelectorAll('.window-bar').forEach(function(bar){
    bar.addEventListener('mousedown', function(e){
      draggedWindow = bar.parentElement;
      offsetX = e.clientX - draggedWindow.offsetLeft;
      offsetY = e.clientY - draggedWindow.offsetTop;
    });
  });

  document.addEventListener('mousemove', function(e){
    if(draggedWindow){
      draggedWindow.style.left = (e.clientX - offsetX) + 'px';
      draggedWindow.style.top = (e.clientY - offsetY) + 'px';
    }
  });

  document.addEventListener('mouseup', function(){
    draggedWindow = null;
  });
</script>
</body>
  </html>
